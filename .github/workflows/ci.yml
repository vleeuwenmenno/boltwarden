name: CI and release artifacts
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Check dependency advisories and yanked crates
        run: |
          cargo +1.98.1 install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Check packaging scripts
        run: |
          python3 -m unittest discover -s scripts/tests
          bash -n scripts/install.sh packaging/boltwarden-setup
      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build distribution packages
        run: |
          docker buildx build --file packaging/Dockerfile \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --output type=local,dest=dist .
      - name: Test Debian installation, native-host startup, and removal
        run: docker buildx build --file packaging/Dockerfile.smoke dist
      - name: Validate package contents and checksums
        run: |
          cd dist
          sha256sum --check ./*.sha256
          for file in *.deb; do dpkg-deb --info "$file"; dpkg-deb --contents "$file"; done
          for file in *.pkg.tar.zst; do tar --zstd -tf "$file"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  extensions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit, test in Chromium and Firefox, and package extensions
        run: docker buildx build --file packaging/Dockerfile.extension --output type=local,dest=dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extensions
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [security, linux, extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          version="${RELEASE_TAG#v}"
          for arch in x86_64 aarch64; do
            test -s "boltwarden-${version}-${arch}-linux.tar.gz"
            test -s "boltwarden-${version}-1-${arch}.pkg.tar.zst"
          done
          for arch in amd64 arm64; do test -s "boltwarden_${version}_${arch}.deb"; done
          shopt -s nullglob
          for browser in chrome firefox sources; do
            files=(boltwarden-browser-*-"${browser}".zip)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${browser} extension archive" >&2
              exit 1
            fi
            test -s "${files[0]}"
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to replace assets of an already published release" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
