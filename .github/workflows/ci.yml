name: CI and release artifacts
on:
  push:
    branches: [main, master]
    tags: ['v*', 'extension-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  # Skipped jobs count as passing for required checks, so path-based skipping
  # saves minutes without blocking merges. Tags and manual runs route by name.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.route.outputs.desktop }}
      extension: ${{ steps.route.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: route
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$REF" in
            refs/tags/extension-v*) printf 'desktop=false\nextension=true\n' >> "$GITHUB_OUTPUT" ;;
            refs/tags/*) printf 'desktop=true\nextension=false\n' >> "$GITHUB_OUTPUT" ;;
            *)
              base=""
              [ "$EVENT" = pull_request ] && base="$PR_BASE"
              [ "$EVENT" = push ] && base="$PUSH_BEFORE"
              python3 scripts/ci-changes.py "$base" | tee -a "$GITHUB_OUTPUT"
              ;;
          esac
  security:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Check dependency advisories and yanked crates
        run: |
          cargo +1.98.1 install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Check packaging scripts
        run: |
          python3 -m unittest discover -s scripts/tests
          bash -n scripts/install.sh packaging/boltwarden-setup
      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/set-version.py
          python3 scripts/check-release.py
  linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/set-version.py
      - name: Test and build distribution packages
        run: |
          docker buildx build --file packaging/Dockerfile \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --output type=local,dest=dist .
      - name: Test Debian installation, native-host startup, and removal
        run: docker buildx build --file packaging/Dockerfile.smoke dist
      - name: Test Fedora installation, native-host startup, and removal
        run: docker buildx build --file packaging/Dockerfile.fedora-smoke dist
      - name: Validate package contents and checksums
        run: |
          cd dist
          sha256sum --check ./*.sha256
          for file in *.deb; do dpkg-deb --info "$file"; dpkg-deb --contents "$file"; done
          for file in *.pkg.tar.zst; do tar --zstd -tf "$file"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  windows:
    name: windows-x86_64
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/set-version.py
      - name: Install Rust tools
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test Windows platform and shared vault behavior
        run: cargo +1.98.1 test --locked --target x86_64-pc-windows-msvc --lib -- --test-threads=1
      - name: Generate notices and build both executables
        shell: pwsh
        run: |
          rustup default 1.98.1
          python scripts/third-party-notices.py rust THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --target x86_64-pc-windows-msvc --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned installer compiler
        shell: pwsh
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compiler
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno Setup compiler checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process -FilePath $compiler -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "BOLTWARDEN_ISCC=$destination\ISCC.exe" >> $env:GITHUB_ENV
      - name: Package unsigned preview and check PE runtime dependencies
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          python scripts/package-windows.py --binary-dir target/x86_64-pc-windows-msvc/release --iscc "$env:BOLTWARDEN_ISCC" --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test ZIP, installer, upgrade, registration, and uninstall
        run: python scripts/windows-smoke.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error
  extensions:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check extension release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py
      - name: Audit, test in Chromium and Firefox, and package extensions
        run: docker buildx build --file packaging/Dockerfile.extension --output type=local,dest=dist .
      - name: Upload Chrome extension artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-chrome
          path: |
            dist/boltwarden-browser-*-chrome.zip
            dist/boltwarden-browser-*-chrome.zip.sha256
          if-no-files-found: error
      - name: Upload Firefox extension artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-firefox
          path: |
            dist/boltwarden-browser-*-firefox.zip
            dist/boltwarden-browser-*-firefox.zip.sha256
          if-no-files-found: error
      - name: Upload source extension artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-sources
          path: |
            dist/boltwarden-browser-*-sources.zip
            dist/boltwarden-browser-*-sources.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [security, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/set-version.py
          python3 scripts/check-release.py
          python3 scripts/check-release-artifacts.py dist
          version="${RELEASE_TAG#v}"
          # Curated notes are optional; otherwise GitHub lists the merged pull requests.
          notes=(--generate-notes)
          if [ -f "docs/release-notes-${version}.md" ]; then
            notes=(--notes-file "docs/release-notes-${version}.md")
          fi
          prerelease=false
          flags=()
          if [[ "$version" == *-rc.* ]]; then
            prerelease=true
            flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" \
              --title "Boltwarden $version" "${notes[@]}"
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to replace assets of an already published release" >&2
            exit 1
          fi
          edit_notes=()
          if [ "${notes[0]}" = --notes-file ]; then
            edit_notes=("${notes[@]}")
          fi
          gh release edit "$RELEASE_TAG" --prerelease="$prerelease" \
            --title "Boltwarden $version" "${edit_notes[@]}"
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release download "$RELEASE_TAG" --dir downloaded-release
          python3 scripts/check-release-artifacts.py downloaded-release
  release-extension:
    if: startsWith(github.ref, 'refs/tags/extension-v')
    needs: [extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create draft extension release with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-release.py
          python3 scripts/check-release-artifacts.py --extension dist
          version="${RELEASE_TAG#extension-v}"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "Boltwarden browser extension $version"
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to replace assets of an already published release" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release download "$RELEASE_TAG" --dir downloaded-release
          python3 scripts/check-release-artifacts.py --extension downloaded-release
