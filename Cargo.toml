[package]
name = "bw-quick-access"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
libc = "0.2"
signature = "3"
pbkdf2 = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
url = "2"
toml = "1"
argon2 = "0.5"
ksni = { version = "0.3", features = ["blocking"] }
ssh-key = { version = "0.7.0-rc.10", features = ["crypto", "encryption", "p256", "p384", "p521"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
